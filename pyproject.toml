[project]
name = "high-street-property-occupancy-tracking-experiment-analysis"
version = "0.1.0"
description = "Reproducible MLflow analysis pipeline for MOTIP, BoostTrack++, and SiamMOT experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.8,<4.0",
  "mlflow>=2.16,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "scipy>=1.13,<2.0",
  "seaborn>=0.13,<1.0",
]

[tool.uv]
package = false
